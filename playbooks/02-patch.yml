---
- name: 02 - Patch and Update Cluster Nodes
  hosts: k3s_cluster
  gather_facts: true
  become: true
  serial: 1
  tasks:
    - name: Upgrade all system packages via apt
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        cache_valid_time: 3600

    - name: Autoremove obsolete packages and dependencies
      ansible.builtin.apt:
        autoremove: true
        purge: true

    - name: Check if a reboot is required by kernel/package updates
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_flag

    - name: Sequentially reboot node if required
      ansible.builtin.reboot:
        msg: "Rebooting post OS patching"
        reboot_timeout: 300
      when: reboot_required_flag.stat.exists
